<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Three orbital ellipses at 0deg, 60deg, 120deg -->
  <ellipse cx="256" cy="256" rx="200" ry="78" fill="none" stroke="#111" stroke-width="18"/>
  <ellipse cx="256" cy="256" rx="200" ry="78" fill="none" stroke="#111" stroke-width="18" transform="rotate(60 256 256)"/>
  <ellipse cx="256" cy="256" rx="200" ry="78" fill="none" stroke="#111" stroke-width="18" transform="rotate(120 256 256)"/>
  <!-- Orbital node circles - white fill masks the ellipse endpoints -->
  <circle cx="456" cy="256" r="24" fill="white" stroke="#111" stroke-width="18"/>
  <circle cx="56"  cy="256" r="24" fill="white" stroke="#111" stroke-width="18"/>
  <circle cx="356" cy="429" r="24" fill="white" stroke="#111" stroke-width="18"/>
  <circle cx="156" cy="83"  r="24" fill="white" stroke="#111" stroke-width="18"/>
  <circle cx="156" cy="429" r="24" fill="white" stroke="#111" stroke-width="18"/>
  <circle cx="356" cy="83"  r="24" fill="white" stroke="#111" stroke-width="18"/>
  <!-- AI label -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-size="160" font-weight="900" font-family="Arial Black, Arial, sans-serif"
        fill="#111">AI</text>
</svg>

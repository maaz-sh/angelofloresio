    <path d="
      M55 10
      C40 8 20 14 12 28
      C6 38 5 52 8 65
      C3 70 0 78 2 88
      C4 98 12 104 22 106
      C28 118 38 128 50 132
      C58 135 68 134 74 128
      C80 122 82 112 80 102
      C92 96 102 85 104 72
      C106 60 100 46 90 38
      C82 22 68 12 55 10Z
    "/>
    <!-- Pointed ear -->

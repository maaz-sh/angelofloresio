<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <!-- Purple W with gold border -->
  <polygon
    points="42,30 95,30 165,258 205,80 245,258 315,30 368,30 330,298 252,298 205,120 158,298 80,298"
    fill="#4b2e83"
    stroke="#e8d5a3"
    stroke-width="24"
    stroke-linejoin="miter"
    stroke-miterlimit="6"
    paint-order="stroke fill"
  />

  <!-- Husky head silhouette in gold, positioned in center of W -->
  <g transform="translate(148, 90)" fill="#e8d5a3">

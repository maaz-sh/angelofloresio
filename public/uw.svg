    <!-- Inner ear -->
    <path d="M54 10 C56 3 62 -2 66 5 C62 8 57 10 54 10Z" fill="#4b2e83"/>
    <!-- Eye -->
    <ellipse cx="38" cy="55" rx="7" ry="6" fill="#4b2e83"/>
    <circle cx="36" cy="54" r="2" fill="#e8d5a3"/>
    <!-- Snout detail -->
    <path d="M20 80 C24 76 32 75 36 80 C32 85 24 85 20 80Z" fill="#4b2e83"/>
    <!-- Mane/fur detail on neck right side -->
    <path d="M80 102 C88 92 96 82 98 70 C92 80 86 92 80 102Z" fill="#c9b87a"/>
    <path d="M78 110 C88 100 98 88 100 74 C93 85 88 98 78 110Z" fill="#c9b87a"/>
